<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuito LED</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --panel-bg: rgba(255, 255, 255, 0.92);
      --accent: #2563eb;
      --accent-light: #3b82f6;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: rgba(0, 0, 0, 0.12);
      --thumb-size: 22px;
      --track-height: 4px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* ── Main circuit area ── */
    #circuit-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      transition: bottom 0.3s ease;
    }

    #circuit-svg {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      flex-shrink: 1;
    }

    /* ── Results strip ── */
    .results {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      justify-content: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      max-width: 560px;
      width: 100%;
    }

    .result-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .result-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .result-value {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    #warning-message-circuit {
      max-width: 560px;
      width: 100%;
      font-size: 12px;
    }

    #warning-message-circuit .warning {
      background: #fef9c3;
      border: 1px solid #fbbf24;
      color: #92400e;
      padding: 7px 12px;
      border-radius: 6px;
    }

    #warning-message-circuit .error {
      background: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 7px 12px;
      border-radius: 6px;
    }

    /* ── Controls panel ── */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    #controls.collapsed {
      transform: translateY(calc(100% - 44px));
    }

    #toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0 0 10px;
      -webkit-tap-highlight-color: transparent;
    }

    #toggle-btn svg {
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    #controls.collapsed #toggle-btn svg {
      transform: rotate(180deg);
    }

    /* ── Controls grid ── */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 20px;
    }

    @media (max-width: 480px) {
      .controls-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 14px;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
    }

    .control-label .name {
      font-weight: 600;
      color: var(--accent-light);
      font-style: italic;
      font-size: 13px;
    }

    .control-label .val {
      color: var(--text-muted);
      font-size: 11px;
      min-width: 36px;
      text-align: right;
    }

    /* ── Custom range slider ── */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: var(--thumb-size);
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: var(--track-height);
      border-radius: 2px;
      background: linear-gradient(to right,
        var(--accent) 0%,
        var(--accent) var(--pct, 80%),
        rgba(0,0,0,0.12) var(--pct, 80%),
        rgba(0,0,0,0.12) 100%
      );
    }

    input[type="range"]::-moz-range-track {
      height: var(--track-height);
      border-radius: 2px;
      background: rgba(0,0,0,0.12);
    }

    input[type="range"]::-moz-range-progress {
      height: var(--track-height);
      border-radius: 2px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent);
      margin-top: calc((var(--track-height) - var(--thumb-size)) / 2);
      transition: box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      box-shadow: 0 0 0 5px var(--accent-light);
    }

    input[type="range"]::-moz-range-thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      transition: border-color 0.15s ease;
    }

    input[type="range"]::-moz-range-thumb:active {
      border-color: var(--accent-light);
    }

    /* ── Select and number inputs ── */
    select,
    input[type="number"] {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    /* ── Extras row ── */
    .extras-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .extras-row::-webkit-scrollbar {
      display: none;
    }

    /* ── Resistor visual wrapper ── */
    .resistor-visual-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .resistor-visual svg {
      display: block;
      width: 160px;
      height: auto;
    }

    .led-info {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.7;
      flex-shrink: 0;
    }

    .led-info strong {
      color: var(--text);
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    /* ── Battery items ── */
    #battery-types {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-top: 10px;
    }

    #battery-types::-webkit-scrollbar {
      display: none;
    }

    .battery-item {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      min-width: 70px;
    }

    .battery-no-data {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Main circuit area -->
  <div id="circuit-container">
    <svg id="circuit-svg" width="400" height="220" viewBox="0 70 400 220">
      <!-- Battery -->
      <g id="battery">
        <line x1="50" y1="200" x2="100" y2="200" stroke="#333" stroke-width="3"/>
        <line x1="100" y1="180" x2="100" y2="220" stroke="#333" stroke-width="5"/>
        <line x1="110" y1="190" x2="110" y2="210" stroke="#333" stroke-width="5"/>
        <text x="75" y="170" text-anchor="middle" font-size="14" fill="#333">+</text>
        <text x="75" y="240" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">Batteria</text>
        <text x="75" y="260" text-anchor="middle" font-size="14" fill="#666" id="battery-label">9V</text>
      </g>

      <!-- Wire from battery to resistor -->
      <line x1="110" y1="200" x2="140" y2="200" stroke="#333" stroke-width="3"/>

      <!-- Resistor -->
      <g id="resistor">
        <path d="M 140 200 L 150 195 L 160 205 L 170 195 L 180 205 L 190 195 L 200 205 L 210 200"
              stroke="#333" stroke-width="3" fill="none"/>
        <rect x="145" y="185" width="60" height="30" fill="#f4a460" opacity="0.3" stroke="#333" stroke-width="1"/>
        <text x="175" y="240" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">Resistenza</text>
        <text x="175" y="260" text-anchor="middle" font-size="14" fill="#666" id="resistor-label">330&#937;</text>
      </g>

      <!-- Wire from resistor to LED -->
      <line x1="210" y1="200" x2="240" y2="200" stroke="#333" stroke-width="3"/>

      <!-- LED -->
      <g id="led">
        <circle cx="260" cy="200" r="20" id="led-circle" fill="#ff0000" opacity="0.7" stroke="#333" stroke-width="2"/>
        <path d="M 250 200 L 260 195 L 260 205 Z" fill="#333"/>
        <line x1="260" y1="195" x2="260" y2="205" stroke="#333" stroke-width="2"/>
        <line x1="265" y1="188" x2="275" y2="178" stroke="#ffeb3b" stroke-width="2" id="light-ray-1"/>
        <line x1="265" y1="212" x2="275" y2="222" stroke="#ffeb3b" stroke-width="2" id="light-ray-2"/>
        <polygon points="275,178 278,178 276,174" fill="#ffeb3b" id="light-arrow-1"/>
        <polygon points="275,222 278,222 276,226" fill="#ffeb3b" id="light-arrow-2"/>
        <text x="260" y="240" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">LED</text>
        <text x="260" y="260" text-anchor="middle" font-size="14" fill="#666" id="led-label">Rosso</text>
      </g>

      <!-- Wire from LED back to battery (completing circuit) -->
      <line x1="280" y1="200" x2="350" y2="200" stroke="#333" stroke-width="3"/>
      <line x1="350" y1="200" x2="350" y2="100" stroke="#333" stroke-width="3"/>
      <line x1="350" y1="100" x2="50" y2="100" stroke="#333" stroke-width="3"/>
      <line x1="50" y1="100" x2="50" y2="200" stroke="#333" stroke-width="3"/>

      <!-- Current direction arrows -->
      <g id="current-arrows">
        <polygon points="125,200 130,197 130,203" fill="#2196f3"/>
        <polygon points="225,200 230,197 230,203" fill="#2196f3"/>
        <polygon points="315,200 320,197 320,203" fill="#2196f3"/>
        <polygon points="350,150 347,145 353,145" fill="#2196f3"/>
        <polygon points="200,100 197,95 203,95" fill="#2196f3"/>
        <text x="200" y="85" text-anchor="middle" font-size="14" fill="#2196f3" font-weight="bold" id="current-label">I = 20mA</text>
      </g>
    </svg>

    <div class="results">
      <div class="result-item">
        <span class="result-label">Corrente:</span>
        <span class="result-value" id="result-current-circuit">20.00 mA</span>
      </div>
      <div class="result-item">
        <span class="result-label">V<sub>LED</sub>:</span>
        <span class="result-value" id="result-led-voltage-circuit">2.0 V</span>
      </div>
      <div class="result-item">
        <span class="result-label">V<sub>R</sub>:</span>
        <span class="result-value" id="result-resistor-voltage-circuit">7.0 V</span>
      </div>
      <div class="result-item">
        <span class="result-label">P<sub>R</sub>:</span>
        <span class="result-value" id="result-power-circuit">140 mW</span>
      </div>
      <div class="result-item">
        <span class="result-label">P<sub>LED</sub>:</span>
        <span class="result-value" id="result-led-power-circuit">40 mW</span>
      </div>
    </div>

    <div id="warning-message-circuit"></div>
  </div>

  <!-- Controls panel -->
  <div id="controls">
    <button id="toggle-btn" aria-label="Toggle controls">
      <span>Parametri Circuito LED</span>
      <svg width="14" height="8" viewBox="0 0 14 8" fill="none" aria-hidden="true">
        <path d="M1 1l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="controls-grid">
      <div class="control-group">
        <div class="control-label">
          <span class="name">Batteria</span>
          <span class="val"><span id="voltage-display">9</span> V</span>
        </div>
        <input type="range" id="voltage" min="0" max="5" step="1" value="4" list="voltage-markers">
        <datalist id="voltage-markers">
          <option value="0" label="1.5V"></option>
          <option value="1" label="3V"></option>
          <option value="2" label="4.5V"></option>
          <option value="3" label="6V"></option>
          <option value="4" label="9V"></option>
          <option value="5" label="12V"></option>
        </datalist>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span class="name">LED</span>
        </div>
        <select id="led-color">
          <option value="red">Rosso</option>
          <option value="green">Verde</option>
          <option value="blue">Blu</option>
          <option value="yellow">Giallo</option>
          <option value="white">Bianco</option>
        </select>
      </div>
    </div>

    <div id="battery-types"></div>

    <div class="extras-row">
      <div class="resistor-visual-wrapper">
        <div class="control-group">
          <div class="control-label">
            <span class="name">Resistenza</span>
            <span class="val"><span id="resistance-display">330</span> &#937;</span>
          </div>
          <input type="range" id="resistance" min="0" max="16" step="1" value="7" list="resistance-markers">
          <!-- max is also set dynamically by JS to match resistanceValues.length - 1 -->
          <datalist id="resistance-markers">
            <option value="0" label="33&#937;"></option>
            <option value="3" label="100&#937;"></option>
            <option value="7" label="330&#937;"></option>
            <option value="11" label="1k&#937;"></option>
            <option value="16" label="10k&#937;"></option>
          </datalist>
        </div>
        <div class="resistor-visual" id="resistor-color-code">
        <svg width="200" height="140" viewBox="0 0 200 140">
          <!-- Resistor body -->
          <rect x="20" y="55" width="160" height="30" fill="#d4a574" stroke="#8B6F47" stroke-width="2" rx="3"/>
          <!-- Wire leads -->
          <line x1="0" y1="70" x2="20" y2="70" stroke="#999" stroke-width="2"/>
          <line x1="180" y1="70" x2="200" y2="70" stroke="#999" stroke-width="2"/>
          <!-- Color bands -->
          <rect id="band1" x="45" y="55" width="12" height="30" fill="#000000"/>
          <rect id="band2" x="70" y="55" width="12" height="30" fill="#000000"/>
          <rect id="band3" x="95" y="55" width="12" height="30" fill="#000000"/>
          <rect id="band4" x="145" y="55" width="12" height="30" fill="#FFD700"/>
          <!-- Callout lines -->
          <line x1="51" y1="55" x2="51" y2="35" stroke="#666" stroke-width="1"/>
          <line x1="76" y1="55" x2="76" y2="25" stroke="#666" stroke-width="1"/>
          <line x1="101" y1="55" x2="101" y2="35" stroke="#666" stroke-width="1"/>
          <line x1="151" y1="85" x2="151" y2="105" stroke="#666" stroke-width="1"/>
          <!-- Callout labels -->
          <text x="51" y="20" text-anchor="middle" font-size="10" fill="#555" font-weight="500">1&#170; cifra</text>
          <text id="band1-value" x="51" y="32" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold">3</text>
          <text x="76" y="10" text-anchor="middle" font-size="10" fill="#555" font-weight="500">2&#170; cifra</text>
          <text id="band2-value" x="76" y="22" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold">3</text>
          <text x="101" y="20" text-anchor="middle" font-size="10" fill="#555" font-weight="500">Moltiplic.</text>
          <text id="band3-value" x="101" y="32" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold">&#215;10</text>
          <text x="151" y="115" text-anchor="middle" font-size="10" fill="#555" font-weight="500">Tolleranza</text>
          <text id="band4-value" x="151" y="127" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold">&#177;5%</text>
        </svg>
        </div>
      </div>

      <div class="led-info">
        <strong>Caratteristiche LED</strong>
        V<sub>f</sub>: <span id="led-forward-voltage">2.0 V</span><br>
        I<sub>max</sub>: <span id="led-max-current">30 mA</span><br>
        I<sub>typ</sub>: <span id="led-typical-current">20 mA</span>
      </div>

    </div>
  </div>

  <script>
    'use strict';

    // Battery types database
    var batteryDatabase = {
        1.5: {
            voltage: 1.5,
            types: [
                { name: 'AA (Stilo)', icon: 'cylindrical', size: 'AA' },
                { name: 'AAA (Ministilo)', icon: 'cylindrical', size: 'AAA' },
                { name: 'C (Mezzatorcia)', icon: 'cylindrical', size: 'C' },
                { name: 'D (Torcia)', icon: 'cylindrical', size: 'D' }
            ]
        },
        3: {
            voltage: 3,
            types: [
                { name: '2\u00d7 AA in serie', icon: 'double-cylindrical', size: 'AA' },
                { name: '2\u00d7 AAA in serie', icon: 'double-cylindrical', size: 'AAA' },
                { name: 'CR2032 (Bottone)', icon: 'coin', size: 'CR2032' },
                { name: 'Litio CR123A', icon: 'cylindrical', size: 'CR123A' }
            ]
        },
        4.5: {
            voltage: 4.5,
            types: [
                { name: '3\u00d7 AA in serie', icon: 'triple-cylindrical', size: 'AA' },
                { name: '3\u00d7 AAA in serie', icon: 'triple-cylindrical', size: 'AAA' },
                { name: 'Batteria piatta 3R12', icon: 'flat', size: '3R12' }
            ]
        },
        6: {
            voltage: 6,
            types: [
                { name: '4\u00d7 AA in serie', icon: 'quad-cylindrical', size: 'AA' },
                { name: '4\u00d7 AAA in serie', icon: 'quad-cylindrical', size: 'AAA' },
                { name: 'Batteria 4R25 (Lanterna)', icon: 'lantern', size: '4R25' }
            ]
        },
        9: {
            voltage: 9,
            types: [
                { name: 'Batteria 9V (PP3)', icon: 'rectangular', size: '9V' },
                { name: '6\u00d7 AA in serie', icon: 'multi-cylindrical', size: 'AA' }
            ]
        },
        12: {
            voltage: 12,
            types: [
                { name: '8\u00d7 AA in serie', icon: 'multi-cylindrical', size: 'AA' },
                { name: 'Batteria al piombo 12V', icon: 'lead-acid', size: '12V' },
                { name: 'Batteria A23 (12V)', icon: 'small-cylindrical', size: 'A23' }
            ]
        }
    };

    function createBatteryIcon(type, size) {
        var icons = {
            'cylindrical': '<svg width="30" height="50" viewBox="0 0 30 50"><rect x="8" y="0" width="14" height="3" fill="#888" rx="1"/><rect x="5" y="3" width="20" height="44" fill="#1976d2" stroke="#333" stroke-width="1.5" rx="2"/><line x1="5" y1="15" x2="25" y2="15" stroke="#fff" stroke-width="1" opacity="0.3"/><text x="15" y="35" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">' + size + '</text></svg>',
            'double-cylindrical': '<svg width="60" height="50" viewBox="0 0 60 50"><g><rect x="3" y="0" width="10" height="2" fill="#888" rx="1"/><rect x="1" y="2" width="14" height="32" fill="#1976d2" stroke="#333" stroke-width="1" rx="2"/><text x="8" y="25" text-anchor="middle" font-size="6" fill="#fff" font-weight="bold">' + size + '</text></g><line x1="15" y1="18" x2="30" y2="18" stroke="#333" stroke-width="1.5" stroke-dasharray="2,2"/><g transform="translate(29,0)"><rect x="3" y="0" width="10" height="2" fill="#888" rx="1"/><rect x="1" y="2" width="14" height="32" fill="#1976d2" stroke="#333" stroke-width="1" rx="2"/><text x="8" y="25" text-anchor="middle" font-size="6" fill="#fff" font-weight="bold">' + size + '</text></g><text x="30" y="46" text-anchor="middle" font-size="7" fill="#333">2\u00d7</text></svg>',

            'small-cylindrical': '<svg width="20" height="45" viewBox="0 0 20 45"><rect x="6" y="0" width="8" height="2" fill="#888" rx="1"/><rect x="4" y="2" width="12" height="40" fill="#1976d2" stroke="#333" stroke-width="1" rx="1.5"/><text x="10" y="26" text-anchor="middle" font-size="6" fill="#fff" font-weight="bold" transform="rotate(-90, 10, 26)">' + size + '</text></svg>'
        };
        return icons[type] || icons['cylindrical'];
    }

    function updateBatteryTypes(voltage) {
        var container = document.getElementById('battery-types');
        var info = batteryDatabase[voltage];
        if (!info) {
            container.innerHTML = '<div class="battery-no-data">Nessuna configurazione standard disponibile</div>';
            return;
        }
        var html = '';
        info.types.forEach(function(type) {
            html += '<div class="battery-item">' + createBatteryIcon(type.icon, type.size) + '<span>' + type.name + '</span></div>';
        });
        container.innerHTML = html;
    }

    var ledDatabase = {
        red:    { name: 'Rosso',  forwardVoltage: 2.0, maxCurrent: 30, typicalCurrent: 20, color: '#ff0000', lightColor: '#ffeb3b' },
        green:  { name: 'Verde',  forwardVoltage: 2.2, maxCurrent: 30, typicalCurrent: 20, color: '#00ff00', lightColor: '#ffeb3b' },
        blue:   { name: 'Blu',    forwardVoltage: 3.2, maxCurrent: 30, typicalCurrent: 20, color: '#0000ff', lightColor: '#add8e6' },
        yellow: { name: 'Giallo', forwardVoltage: 2.1, maxCurrent: 30, typicalCurrent: 20, color: '#ffff00', lightColor: '#ffeb3b' },
        white:  { name: 'Bianco', forwardVoltage: 3.3, maxCurrent: 30, typicalCurrent: 20, color: '#ffffff', lightColor: '#ffffff' }
    };

    var colorCodes = {
        0: '#000000', 1: '#8B4513', 2: '#FF0000', 3: '#FFA500', 4: '#FFFF00',
        5: '#008000', 6: '#0000FF', 7: '#9400D3', 8: '#808080', 9: '#FFFFFF'
    };

    var multiplierCodes = {
        0.01: '#C0C0C0', 0.1: '#FFD700', 1: '#000000', 10: '#8B4513',
        100: '#FF0000', 1000: '#FFA500', 10000: '#FFFF00', 100000: '#008000',
        1000000: '#0000FF', 10000000: '#9400D3'
    };

    var voltageInput    = document.getElementById('voltage');
    var voltageDisplay  = document.getElementById('voltage-display');
    var resistanceInput = document.getElementById('resistance');
    var resistanceDisplay = document.getElementById('resistance-display');
    var ledColorSelect  = document.getElementById('led-color');
    var ledCircle       = document.getElementById('led-circle');
    var ledLabel        = document.getElementById('led-label');
    var batteryLabel    = document.getElementById('battery-label');
    var resistorLabel   = document.getElementById('resistor-label');
    var currentLabel    = document.getElementById('current-label');
    var lightRay1       = document.getElementById('light-ray-1');
    var lightRay2       = document.getElementById('light-ray-2');
    var lightArrow1     = document.getElementById('light-arrow-1');
    var lightArrow2     = document.getElementById('light-arrow-2');
    var ledForwardVoltage  = document.getElementById('led-forward-voltage');
    var ledMaxCurrent      = document.getElementById('led-max-current');
    var ledTypicalCurrent  = document.getElementById('led-typical-current');
    var band1      = document.getElementById('band1');
    var band2      = document.getElementById('band2');
    var band3      = document.getElementById('band3');
    var band4      = document.getElementById('band4');
    var band1Value = document.getElementById('band1-value');
    var band2Value = document.getElementById('band2-value');
    var band3Value = document.getElementById('band3-value');
    var band4Value = document.getElementById('band4-value');

    var resultCurrentCircuit         = document.getElementById('result-current-circuit');
    var resultLedVoltageCircuit      = document.getElementById('result-led-voltage-circuit');
    var resultResistorVoltageCircuit = document.getElementById('result-resistor-voltage-circuit');
    var resultPowerCircuit           = document.getElementById('result-power-circuit');
    var resultLedPowerCircuit        = document.getElementById('result-led-power-circuit');
    var warningMessageCircuit        = document.getElementById('warning-message-circuit');

    function setResultText(el, text) { if (el) el.textContent = text; }
    function setResultHtml(el, html) { if (el) el.innerHTML  = html; }

    function updateTrackFill(input) {
        var pct = ((+input.value - +input.min) / (+input.max - +input.min)) * 100;
        input.style.setProperty('--pct', pct + '%');
    }

    function updateResistorColorBands(resistance) {
        if (resistance <= 0) {
            band1.setAttribute('fill', '#000000');
            band2.setAttribute('fill', '#000000');
            band3.setAttribute('fill', '#000000');
            band4.setAttribute('fill', '#FFD700');
            band1Value.textContent = '0';
            band2Value.textContent = '0';
            band3Value.textContent = '\u00d71';
            band4Value.textContent = '\u00b15%';
            return;
        }

        var firstDigit, secondDigit, multiplier;
        var rv = resistance;
        multiplier = 1;
        while (rv >= 100 && multiplier <= 1000000) { rv /= 10; multiplier *= 10; }

        if (resistance < 10) {
            firstDigit  = Math.floor(resistance);
            secondDigit = Math.floor((resistance * 10) % 10);
            multiplier  = 0.1;
        } else if (resistance < 100) {
            firstDigit  = Math.floor(resistance / 10);
            secondDigit = Math.floor(resistance % 10);
            multiplier  = 1;
        } else {
            var sv = Math.round(rv);
            firstDigit  = Math.floor(sv / 10);
            secondDigit = sv % 10;
        }

        firstDigit  = Math.min(9, Math.max(0, firstDigit));
        secondDigit = Math.min(9, Math.max(0, secondDigit));

        if (colorCodes[firstDigit])      band1.setAttribute('fill', colorCodes[firstDigit]);
        if (colorCodes[secondDigit])     band2.setAttribute('fill', colorCodes[secondDigit]);
        if (multiplierCodes[multiplier]) band3.setAttribute('fill', multiplierCodes[multiplier]);
        else                             band3.setAttribute('fill', '#000000');
        band4.setAttribute('fill', '#FFD700');

        band1Value.textContent = firstDigit.toString();
        band2Value.textContent = secondDigit.toString();

        var mt;
        if (multiplier >= 1000000)   mt = '\u00d7' + (multiplier / 1000000) + 'M';
        else if (multiplier >= 1000) mt = '\u00d7' + (multiplier / 1000) + 'k';
        else                         mt = '\u00d7' + multiplier;

        band3Value.textContent = mt;
        band4Value.textContent = '\u00b15%';
    }

    function calculateCircuit() {
        var voltageMap  = [1.5, 3, 4.5, 6, 9, 12];
        // Common resistor values for LED circuits (subset of E12/E24 series)
        var resistanceValues = [33, 47, 68, 100, 150, 220, 270, 330, 470, 560, 680, 1000, 1500, 2200, 3300, 4700, 10000];
        resistanceInput.max = resistanceValues.length - 1;
        var voltage     = voltageMap[parseInt(voltageInput.value)];
        var resistance  = resistanceValues[parseInt(resistanceInput.value)];
        var led         = ledDatabase[ledColorSelect.value];

        updateBatteryTypes(voltage);
        updateTrackFill(voltageInput);
        updateTrackFill(resistanceInput);

        voltageDisplay.textContent = parseFloat(voltage.toFixed(1));
        resistanceDisplay.textContent = resistance >= 1000 ? (resistance / 1000) + 'k' : resistance;
        batteryLabel.textContent   = parseFloat(voltage.toFixed(1)) + 'V';
        resistorLabel.textContent  = resistance + '\u03a9';
        ledLabel.textContent       = led.name;

        ledForwardVoltage.textContent = led.forwardVoltage.toFixed(1) + ' V';
        ledMaxCurrent.textContent     = led.maxCurrent + ' mA';
        ledTypicalCurrent.textContent = led.typicalCurrent + ' mA';

        updateResistorColorBands(resistance);

        ledCircle.setAttribute('fill', led.color);
        ledCircle.style.filter = 'brightness(1.2)';
        lightRay1.setAttribute('stroke', led.lightColor);
        lightRay2.setAttribute('stroke', led.lightColor);
        lightArrow1.setAttribute('fill', led.lightColor);
        lightArrow2.setAttribute('fill', led.lightColor);

        var voltageAcrossResistor = voltage - led.forwardVoltage;
        var current = 0;
        var warning = '';

        if (resistance <= 0) {
            warning = '<div class="error">\u26a0\ufe0f ERRORE: La resistenza deve essere maggiore di 0\u03a9 per evitare di danneggiare il LED!</div>';
            setResultText(resultCurrentCircuit, 'N/A');
            setResultText(resultLedVoltageCircuit, 'N/A');
            setResultText(resultResistorVoltageCircuit, 'N/A');
            setResultText(resultPowerCircuit, 'N/A');
            setResultText(resultLedPowerCircuit, 'N/A');
            currentLabel.textContent = 'I = N/A';
            setResultHtml(warningMessageCircuit, warning);
            return;
        }

        if (voltageAcrossResistor < 0) {
            warning = '<div class="error">\u26a0\ufe0f ERRORE: La tensione della batteria (' + voltage.toFixed(1) + 'V) \u00e8 inferiore alla tensione diretta del LED (' + led.forwardVoltage.toFixed(1) + 'V). Il LED non si accender\u00e0!</div>';
        } else {
            current = voltageAcrossResistor / resistance;
            var currentMA = current * 1000;
            if (currentMA > led.maxCurrent) {
                warning = '<div class="warning">\u26a0\ufe0f ATTENZIONE: La corrente (' + currentMA.toFixed(2) + ' mA) supera la corrente massima del LED (' + led.maxCurrent + ' mA). Aumentare la resistenza!</div>';
            } else if (currentMA < 1) {
                warning = '<div class="warning">\u26a0\ufe0f ATTENZIONE: La corrente \u00e8 molto bassa (' + currentMA.toFixed(2) + ' mA). Il LED potrebbe essere poco luminoso.</div>';
            }
        }

        var powerResistor = Math.pow(current, 2) * resistance;
        var powerLed      = current * led.forwardVoltage;
        var mA            = current * 1000;

        setResultText(resultCurrentCircuit,         mA.toFixed(2) + ' mA');
        setResultText(resultLedVoltageCircuit,      led.forwardVoltage.toFixed(1) + ' V');
        setResultText(resultResistorVoltageCircuit, voltageAcrossResistor.toFixed(2) + ' V');
        setResultText(resultPowerCircuit,           (powerResistor * 1000).toFixed(0) + ' mW');
        setResultText(resultLedPowerCircuit,        (powerLed * 1000).toFixed(0) + ' mW');
        currentLabel.textContent = 'I = ' + mA.toFixed(1) + 'mA';

        setResultHtml(warningMessageCircuit, warning);

        var brightness = Math.min(mA / led.typicalCurrent, 2);
        ledCircle.style.opacity = Math.min(0.3 + brightness * 0.5, 1);

        if (mA > 0.5) {
            lightRay1.style.display   = 'block';
            lightRay2.style.display   = 'block';
            lightArrow1.style.display = 'block';
            lightArrow2.style.display = 'block';
            lightRay1.style.opacity   = Math.min(brightness * 0.8, 1);
            lightRay2.style.opacity   = Math.min(brightness * 0.8, 1);
            lightArrow1.style.opacity = Math.min(brightness * 0.8, 1);
            lightArrow2.style.opacity = Math.min(brightness * 0.8, 1);
        } else {
            lightRay1.style.display   = 'none';
            lightRay2.style.display   = 'none';
            lightArrow1.style.display = 'none';
            lightArrow2.style.display = 'none';
        }
    }

    // ── Panel collapse ──
    var controls         = document.getElementById('controls');
    var toggleBtn        = document.getElementById('toggle-btn');
    var circuitContainer = document.getElementById('circuit-container');

    function adjustLayout() {
        var panelH = controls.classList.contains('collapsed') ? 44 : controls.offsetHeight;
        circuitContainer.style.bottom = panelH + 'px';
    }

    toggleBtn.addEventListener('click', function() {
        controls.classList.toggle('collapsed');
        adjustLayout();
    });

    voltageInput.addEventListener('input', calculateCircuit);
    resistanceInput.addEventListener('input', calculateCircuit);
    ledColorSelect.addEventListener('change', calculateCircuit);

    var rafId = null;
    window.addEventListener('resize', function() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function() { adjustLayout(); rafId = null; });
    });

    // Initial render
    updateTrackFill(voltageInput);
    updateTrackFill(resistanceInput);
    calculateCircuit();
    adjustLayout();
  </script>
